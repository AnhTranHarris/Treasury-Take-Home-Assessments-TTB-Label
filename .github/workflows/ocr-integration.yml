name: OCR integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "streamlit_app.py"
      - "src/ocr/**"
      - "src/imaging/**"
      - "src/extraction/**"
      - "src/validation/**"
      - "src/orchestration/**"
      - "src/presentation.py"
      - "scripts/__init__.py"
      - "scripts/ocr_integration_smoke.py"
      - "scripts/deployment_integration_smoke.py"
      - "scripts/generate_demo_label.py"
      - ".github/workflows/ocr-integration.yml"

jobs:
  paddle-ocr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python 3.11 runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Show Paddle runtime versions
        run: |
          python -c "import paddle; print('paddle', paddle.__version__)"
          python -c "import streamlit; print('streamlit', streamlit.__version__)"
          python -c "import paddleocr; print('paddleocr', paddleocr.__version__)"
          python -c "import cv2; print('opencv', cv2.__version__)"
          python -c "from src.ocr.factory import choose_ocr_backend; print('backend', choose_ocr_backend()); assert choose_ocr_backend() == 'paddle'"
      - name: Check Streamlit startup on Python 3.11
        shell: bash
        run: |
          python -m streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Generate demo label
        run: python -m scripts.generate_demo_label
      - name: Run real PaddleOCR and full-pipeline smoke test
        run: python -m scripts.ocr_integration_smoke

  python314-deployment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Python 3.14 deployment dependencies
        run: python -m pip install -r requirements.txt
      - name: Show deployment runtime versions
        run: |
          python -c "import sys; print('python', sys.version)"
          python -c "import streamlit; print('streamlit', streamlit.__version__)"
          python -c "import rapidocr; print('rapidocr', rapidocr.__version__)"
          python -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"
          python -c "import cv2; print('opencv', cv2.__version__)"
          python -c "from src.ocr.factory import choose_ocr_backend; print('backend', choose_ocr_backend()); assert choose_ocr_backend() == 'rapid'"
      - name: Check Streamlit startup on Python 3.14
        shell: bash
        run: |
          python -m streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Generate demo label
        run: python -m scripts.generate_demo_label
      - name: Run RapidOCR deployment-compatible full-pipeline smoke test
        run: python -m scripts.deployment_integration_smoke
