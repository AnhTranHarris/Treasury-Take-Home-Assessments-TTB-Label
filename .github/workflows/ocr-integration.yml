name: OCR integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "src/ocr/**"
      - "src/imaging/**"
      - "scripts/ocr_integration_smoke.py"
      - ".github/workflows/ocr-integration.yml"

jobs:
  ocr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Show runtime versions
        run: |
          python -c "import paddle; print('paddle', paddle.__version__)"
          python -c "import streamlit; print('streamlit', streamlit.__version__)"
          python -c "import paddleocr; print('paddleocr', paddleocr.__version__)"
          python -c "import cv2; print('opencv', cv2.__version__)"
      - name: Run real PaddleOCR smoke test
        run: python scripts/ocr_integration_smoke.py
